version: 2

models:
  # 311 Fact
  - name: fct_311_complaint_facts
    columns:
      - name: agency_dim_id
        tests:
          - not_null
          - relationships:
              to: ref('agency_dimension')
              field: agency_dim_id
      - name: complaint_type_dim_id
        tests:
          - not_null
          - relationships:
              to: ref('complaint_type_dimension')
              field: complaint_type_dim_id
      - name: location_dim_id
        tests:
          - not_null
          - relationships:
              to: ref('location_dimension')
              field: location_dim_id
      - name: status_dim_id
        tests:
          - not_null
          - relationships:
              to: ref('status_dimension')
              field: status_dim_id
      - name: created_date_dim_id
        tests:
          - not_null
          - relationships:
              to: ref('date_dimension')
              field: date_dim_id

  # DOHMH Fact
  - name: fct_dohmh_facts
    columns:
      - name: restaurant_dim_id
        tests:
          - not_null
          - relationships:
              to: ref('restaurant_dimension')
              field: restaurant_dim_id
      - name: location_dim_id
        tests:
          - not_null
          - relationships:
              to: ref('location_dimension')
              field: location_dim_id
      - name: cuisine_dim_id
        tests:
          - relationships:
              to: ref('cuisine_dimension')
              field: cuisine_dim_id
      - name: action_dim_id
        tests:
          - relationships:
              to: ref('action_dimension')
              field: action_dim_id
      - name: violation_dim_id
        tests:
          - relationships:
              to: ref('violation_dimension')
              field: violation_dim_id
      - name: inspection_date_dim_id
        tests:
          - not_null
          - relationships:
              to: ref('date_dimension')
              field: date_dim_id

  # Example dimension tests
  - name: restaurant_dimension
    columns:
      - name: restaurant_dim_id
        tests:
          - not_null
          - unique

  - name: location_dimension
    columns:
      - name: location_dim_id
        tests:
          - not_null
          - unique

  - name: date_dimension
    columns:
      - name: date_dim_id
        tests:
          - not_null
          - unique